[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aircursor"
version = "2.2.0"
description = "Paired remote mouse server with phone controls and optional webcam gestures"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "NiqueWrld", email = "niquewrld@outlook.com" }]
keywords = ["flask", "mouse", "automation", "remote", "control", "REST", "qr", "web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Topic :: System :: Hardware",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Desktop Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "Flask>=3.1,<4",
  "pyautogui==0.9.54",
  "qrcode[pil]>=7.4.2,<9",
  "Pillow>=10.2,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "twine>=5,<7"]
vision = ["mediapipe==0.10.21", "opencv-python>=4.8,<5"]

[project.urls]
Homepage = "https://github.com/pushkkal0201-bit/Air_Cursor"
Repository = "https://github.com/pushkkal0201-bit/Air_Cursor"
Issues = "https://github.com/pushkkal0201-bit/Air_Cursor/issues"
Documentation = "https://github.com/pushkkal0201-bit/Air_Cursor#readme"

[project.scripts]
aircursor = "aircursor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]
[tool.setuptools.package-data]
aircursor = ["templates/*.html", "static/*.js"]
