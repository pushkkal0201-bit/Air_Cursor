name: AirCursor tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless test dependencies
        run: python -m pip install 'Flask>=3,<4' 'qrcode[pil]>=7,<9' 'pytest>=8,<10'
      - name: Compile sources
        run: python -m compileall -q app.py gesture_control.py src/aircursor
      - name: Run tests
        run: python -m pytest -q
