name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest flake8
        pip install -r requirements.txt
    
    - name: Basic syntax check
      run: |
        # Only check for critical syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=build,dist,.git,__pycache__
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --tb=short
      continue-on-error: true
    
    - name: Build test
      run: |
        python -m build
        echo "✅ Package builds successfully"

  build-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: |
        twine check dist/*
        ls -la dist/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-files
        path: dist/
        retention-days: 7

  quick-security:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Quick security check
      run: |
        python -m pip install --upgrade pip
        pip install safety
        pip install -r requirements.txt
        safety check --short-report || echo "⚠️ Security check completed with warnings"

  comment-pr:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-test, quick-security]
    if: github.event_name == 'pull_request' && always()
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v6
      with:
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          const lint_status = '${{ needs.lint-and-test.result }}';
          const build_status = '${{ needs.build-test.result }}';
          const security_status = '${{ needs.quick-security.result }}';
          
          let status_emoji = '✅';
          let status_text = 'All checks passed!';
          
          if (lint_status !== 'success' || build_status !== 'success') {
            status_emoji = '❌';
            status_text = 'Some checks failed. Please review the logs.';
          } else if (security_status !== 'success') {
            status_emoji = '⚠️';
            status_text = 'Security scan completed with warnings. Please review.';
          }
          
          const comment = `## ${status_emoji} CI Results
          
          | Check | Status |
          |-------|--------|
          | Lint & Test | ${lint_status === 'success' ? '✅' : '❌'} |
          | Build Test | ${build_status === 'success' ? '✅' : '❌'} |
          | Security | ${security_status === 'success' ? '✅' : '⚠️'} |
          
          ${status_text}
          
          ---
          *Automated comment by GitHub Actions*`;
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number: pr_number,
            body: comment
          });