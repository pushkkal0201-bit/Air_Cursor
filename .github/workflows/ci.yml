name: AirCursor CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: python -m pip install -e . "pytest>=8,<10" "build>=1,<2" "twine>=5,<7"
      - name: Compile Python sources
        run: python -m compileall -q app.py run_aircursor.py gesture_control.py src/aircursor scripts tests
      - name: Pytest security, API, and gesture suite
        run: python -m pytest -q
      - name: Validate Python package
        run: python -m build
      - name: Check built package metadata
        run: python -m twine check dist/*
      - name: Benchmark in-process Flask API (informational)
        run: python scripts/benchmark_api.py --requests 300
        if: runner.os == 'Linux'
      - name: Set up Node
        uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Check browser JavaScript and voice command parser
        if: runner.os == 'Linux'
        run: |
          node --check src/aircursor/static/touchpad.js
          node --check src/aircursor/static/advanced.js
          node --check src/aircursor/static/voice_commands.js
          node --test tests/voice.test.cjs
