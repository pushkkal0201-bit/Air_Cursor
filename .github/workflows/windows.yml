name: Windows executable and installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6,<7"
      - name: Create portable Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name AirCursor --collect-all aircursor run_aircursor.py
      - name: Smoke test executable
        shell: pwsh
        run: |
          $output = & .\dist\AirCursor\AirCursor.exe --version
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch "AirCursor 2.2.0") {
            throw "Portable executable smoke test failed"
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AirCursor\* -DestinationPath dist\AirCursor-2.2.0-Windows-Portable.zip -Force
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: AirCursor-2.2.0-Windows-Portable
          path: dist/AirCursor-2.2.0-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 not found at expected location" }
          & $iscc installer\AirCursor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AirCursor-2.2.0-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
