name: Validate source release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build a source distribution and wheel
        run: |
          python -m pip install "build>=1,<2" "twine>=5,<7"
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: AirCursor-Python-Packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

# This workflow deliberately does not tag, force-push, or publish to PyPI.
# A signed public release should only be published after Windows hardware testing.
