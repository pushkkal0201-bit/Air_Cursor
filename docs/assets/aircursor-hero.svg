<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">AirCursor — A multi-modal desktop control system</title>
<desc id="desc">Dark technical illustration of desktop, phone, wireless control, voice and hand-tracking landmark lines.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071322"/><stop offset=".55" stop-color="#0D1B3C"/><stop offset="1" stop-color="#1B1143"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10295C"/><stop offset="1" stop-color="#071225"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4DE9E2"/><stop offset="1" stop-color="#9F82FF"/></linearGradient>
 <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#84F7F0"/><stop offset="1" stop-color="#5B9BFF"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8AB0FF" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1440" height="560" rx="28" fill="url(#bg)"/><rect width="1440" height="560" rx="28" fill="url(#grid)"/>
<circle cx="1144" cy="268" r="235" fill="#3B45A7" opacity=".17" filter="url(#glow)"/>
<circle cx="945" cy="190" r="190" fill="#26C9DC" opacity=".08" filter="url(#glow)"/>
<path d="M48 80h100M48 80v90M1392 474h-90M1392 474v-90" stroke="#54D6ED" stroke-opacity=".5" stroke-width="2" fill="none"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <rect x="74" y="73" width="156" height="29" rx="15" fill="#153B51" stroke="#2CC3D6" stroke-opacity=".6"/>
 <circle cx="94" cy="88" r="4" fill="#43F0D1"/><text x="110" y="93" font-size="12" letter-spacing="2" font-weight="700" fill="#86DFF2">HUMAN INTERFACE</text>
 <text x="72" y="198" font-size="77" font-weight="800" letter-spacing="-3" fill="#F1F7FF">Air<tspan fill="url(#accent)">Cursor</tspan></text>
 <text x="75" y="242" fill="#C5D3EB" font-size="21" font-weight="500">Control your computer beyond the mouse.</text>
 <text x="75" y="277" fill="#91A6C8" font-size="17">Touch. Tilt. Gesture. Speak.</text>
 <g font-size="14" font-weight="700">
  <rect x="75" y="331" width="115" height="38" rx="19" fill="#103E53" stroke="#2A8EA9"/><text x="103" y="355" fill="#69E1EF">TOUCH</text>
  <rect x="200" y="331" width="115" height="38" rx="19" fill="#292451" stroke="#6758A7"/><text x="230" y="355" fill="#C4B9FF">MOTION</text>
  <rect x="325" y="331" width="115" height="38" rx="19" fill="#183B55" stroke="#31749E"/><text x="353" y="355" fill="#A6D8FF">VISION</text>
  <rect x="450" y="331" width="109" height="38" rx="19" fill="#35244A" stroke="#8454A7"/><text x="481" y="355" fill="#D9B5FF">VOICE</text>
 </g>
 <path d="M75 424H559" stroke="#5D759D" stroke-opacity=".5"/><text x="75" y="454" fill="#9CB2D4" font-size="15">Private access by default</text>
 <text x="75" y="482" fill="#9CB2D4" font-size="15">Browser controls · Local computer vision · PIN pairing</text>
 <text x="75" y="524" fill="#5F84AD" font-size="12" letter-spacing="2">INTERACTION WITHOUT A DEDICATED REMOTE</text>
</g>
